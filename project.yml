name: Kerbside
options:
  bundleIdPrefix: au.kerbside
  deploymentTarget:
    # Live Activities, interactive widgets and the ActivityKit timer APIs.
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  SignKit:
    path: Packages/SignKit
  SignVision:
    path: Packages/SignVision
  ParkKit:
    path: Packages/ParkKit

# The app and the widget extension both read one record out of one container,
# so both carry the same group and both compile the same Shared sources.
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MACDPWQG37
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Kerbside:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # The alarm sound has to sit in the app bundle for
      # `UNNotificationSound(named:)` to find it, so it is copied rather than
      # compiled and keeps no folder of its own inside the bundle.
      - path: App/Resources/kerbside-alarm.caf
        buildPhase: resources
    dependencies:
      - package: SignKit
      - package: SignVision
      - package: ParkKit
      - target: KerbsideWidgets
        embed: true
    entitlements:
      path: App/Kerbside.entitlements
      properties:
        com.apple.security.application-groups:
          - group.au.kerbside
        # A parking limit running out is the definition of time sensitive, and
        # without this a reminder is buried by Focus at exactly the wrong moment.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kerbside NSW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Kerbside uses only Apple's system encryption. Keeping this in the
        # binary prevents App Store Connect asking the same export compliance
        # question for every build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Tapping a widget or the Lock Screen banner opens the walk back.
        CFBundleURLTypes:
          - CFBundleURLName: au.kerbside
            CFBundleURLSchemes:
              - kerbside
        # The Lock Screen banner and the Dynamic Island.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSCameraUsageDescription: >-
          Kerbside reads parking signs through the camera. Photographs stay on
          the device.
        NSLocationWhenInUseUsageDescription: >-
          Kerbside remembers where you left the car so it can point you back to
          it. The location is written to this device and never leaves it: there
          is no account, no server and no map to fetch.
    settings:
      base:
        PRODUCT_NAME: Kerbside
        PRODUCT_BUNDLE_IDENTIFIER: au.kerbside.Kerbside
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # XcodeGen otherwise supplies its iOS default of iPhone + iPad at the
        # target level, overriding the project-wide iPhone-only setting.
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - KerbsideUITests

  # Drives the real app in a simulator. The packages are tested without one;
  # this covers the parts that only exist on a device: saving a spot, choosing
  # a limit off a sign, and collecting the car again.
  KerbsideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Kerbside
    entitlements:
      path: UITests/KerbsideUITests.entitlements
      properties:
        com.apple.security.application-groups:
          - group.au.kerbside
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.kerbside.Kerbside.UITests
        TEST_TARGET_NAME: Kerbside
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"

  KerbsideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: SignKit
      - package: ParkKit
    entitlements:
      path: Widgets/KerbsideWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.au.kerbside
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Kerbside NSW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: KerbsideWidgets
        PRODUCT_BUNDLE_IDENTIFIER: au.kerbside.Kerbside.Widgets
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"
